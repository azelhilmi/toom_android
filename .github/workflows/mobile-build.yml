name: Build Android (APK + AAB signés)

# Ce workflow tourne sur les runners GitHub (accès réseau complet à Google
# Maven / Maven Central), nécessaire pour l'Android Gradle Plugin et AndroidX.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-build.yml"

jobs:
  android:
    name: Android (APK + AAB signés)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Installer les dépendances web
        run: npm ci

      - name: Build web (Vite)
        run: npm run build

      - name: Synchroniser Capacitor (Android)
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Décoder le keystore de signature
        working-directory: android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_RELEASE_KEYSTORE_BASE64 manquant — voir MOBILE_BUILD_INSTRUCTIONS.md" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build APK + AAB signés (release)
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PRELEASE_STORE_FILE="$(pwd)/release.keystore" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Nettoyer le keystore décodé
        if: always()
        working-directory: android
        run: rm -f release.keystore

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: toom-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publier l'AAB (pour le Play Store)
        uses: actions/upload-artifact@v7
        with:
          name: toom-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
